<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 500px;
    height: 500px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 50% 35%, #1e3a5f 0%, #0f172a 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .mark {
    width: 150px;
    height: 150px;
    background: rgba(245,158,11,0.14);
    border: 3px solid rgba(245,158,11,0.55);
    border-radius: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 24px 60px rgba(245,158,11,0.20);
  }

  .name {
    text-align: center;
    line-height: 1.05;
  }
  .name .a { font-size: 44px; font-weight: 900; color: #ffffff; letter-spacing: -0.03em; display: block; }
  .name .b { font-size: 44px; font-weight: 900; color: #f59e0b; letter-spacing: -0.03em; display: block; }
</style>
</head>
<body>
  <div class="mark">
    <svg width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
  </div>
  <div class="name">
    <span class="a">Invoice</span>
    <span class="b">Forge</span>
  </div>
</body>
</html>
