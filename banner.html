<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1600px;
    height: 480px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 20% 50%, #1e3a5f 0%, #0f172a 60%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 110px;
    position: relative;
  }

  .glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: rgba(245,158,11,0.10);
    filter: blur(120px);
    right: -100px;
    top: -150px;
  }

  .left {
    display: flex;
    flex-direction: column;
    gap: 22px;
    z-index: 2;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .mark {
    width: 72px;
    height: 72px;
    background: rgba(245,158,11,0.15);
    border: 2px solid rgba(245,158,11,0.5);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  h1 {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: -0.04em;
    color: #ffffff;
    line-height: 1;
  }
  h1 span { color: #f59e0b; }

  .tagline {
    font-size: 24px;
    color: #94a3b8;
    font-weight: 400;
    line-height: 1.4;
    max-width: 640px;
  }

  .pills { display: flex; gap: 12px; margin-top: 6px; }
  .pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #cbd5e1;
    font-size: 15px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 100px;
  }

  .right {
    z-index: 2;
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .price-badge {
    background: #f59e0b;
    color: #0f172a;
    font-size: 22px;
    font-weight: 900;
    padding: 14px 32px;
    border-radius: 100px;
    letter-spacing: -0.02em;
  }

  .price-sub {
    font-size: 15px;
    color: #64748b;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="left">
    <div class="brand-row">
      <div class="mark">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>
      <h1>Invoice <span>Forge</span></h1>
    </div>
    <div class="tagline">Professional invoices for freelancers — no subscription, no login, works offline.</div>
    <div class="pills">
      <div class="pill">✓ Print to PDF</div>
      <div class="pill">✓ 6 Currencies</div>
      <div class="pill">✓ Auto Totals</div>
      <div class="pill">✓ Yours Forever</div>
    </div>
  </div>

  <div class="right">
    <div class="price-badge">$12 one-time</div>
    <div class="price-sub">No monthly fees. Ever.</div>
  </div>
</body>
</html>
