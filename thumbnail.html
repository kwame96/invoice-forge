<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 600px;
    height: 600px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .icon {
    width: 88px;
    height: 88px;
    background: rgba(245,158,11,0.15);
    border: 2px solid rgba(245,158,11,0.5);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  h1 {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: -0.04em;
    color: #ffffff;
    text-align: center;
    line-height: 1;
  }

  h1 span { color: #f59e0b; }

  .sub {
    font-size: 17px;
    color: #64748b;
    font-weight: 500;
    text-align: center;
    line-height: 1.5;
  }

  .tag {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.35);
    color: #f59e0b;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 100px;
    margin-top: 4px;
  }
</style>
</head>
<body>

  <div class="icon">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
  </div>

  <h1>Invoice<br><span>Forge</span></h1>

  <div class="sub">Freelance Invoice Generator<br>No subscription · Works offline</div>

  <div class="tag">⚡ One-time $12</div>

</body>
</html>
